name: Private integration validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies without rewriting lockfile
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --dir apps/api exec prisma generate
      - name: API typecheck
        run: pnpm --dir apps/api exec tsc --noEmit
      - name: Web typecheck
        run: pnpm --dir apps/web exec tsc --noEmit
      - name: API production build
        run: pnpm --dir apps/api build
      - name: Web production build
        run: pnpm --dir apps/web build
      # Application checks cannot validate a deployment artifact not yet present.
      # Docker security is a separate hard release gate: issue #11.
      - name: API application tests (deployment suite tracked in issue #11)
        run: pnpm --dir apps/api exec vitest run --exclude 'src/config/docker-secrets.adversarial.spec.ts'
      - name: Web tests
        run: pnpm --dir apps/web exec vitest run
      - name: Report unvalidated deployment gate
        run: |
          if [ ! -f docker-compose.yml ]; then
            echo '::warning title=Deployment security not validated::No reviewed compose exists; Docker security suite is uncollected. Release blocked by issue #11.'
          fi

  gamification-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: square_test
          POSTGRES_PASSWORD: square_test
          POSTGRES_DB: square_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U square_test -d square_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://square_test:square_test@localhost:5432/square_test?schema=public
      GAMIFICATION_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/api exec prisma generate
      - name: Apply schema in disposable PostgreSQL database
        run: pnpm --dir apps/api exec prisma db push --skip-generate
      - name: Verify gamification database contract
        run: pnpm --dir apps/api exec vitest run src/gamification/gamification.postgres.spec.ts
